<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ch16 / step 5 — ガチャ演出アニメ</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif;
         display: grid; place-items: center; min-height: 100vh; margin: 0;
         background: #0f172a; color: #f8fafc; }
  button { font-size: 18px; padding: 14px 28px; border: 0; border-radius: 12px;
           background: #4f46e5; color: white; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .stage { width: 360px; height: 480px; perspective: 800px;
           display: grid; place-items: center; position: relative; }

  .card { position: absolute; inset: 0; background: #1e293b; border-radius: 18px;
          display: grid; place-items: center;
          font-size: 28px; opacity: 0; transform: scale(.6) rotateY(180deg);
          transition: transform .6s cubic-bezier(.2,.8,.2,1.2),
                      opacity .4s, box-shadow .6s; }
  .card.show { opacity: 1; transform: scale(1) rotateY(0deg); }
  .card.r5 { box-shadow: 0 0 80px 12px #f59e0b; background:
             linear-gradient(135deg, #b45309, #fde68a); color: #1f2937; }
  .card.r4 { box-shadow: 0 0 60px 8px #c084fc; }
  .card.r3 { box-shadow: 0 0 40px 4px #60a5fa; }

  .flash { position: fixed; inset: 0; background: white; opacity: 0;
           transition: opacity .25s; pointer-events: none; }
  .flash.on { opacity: 1; }
</style>
</head>
<body>
<div class="flash" id="flash"></div>
<div class="stage" id="stage"></div>
<button id="pull">10連を引く (シミュレーション)</button>

<script>
// 「サーバから貰った結果」 を 1 回先に確定させ、 演出は後付け、 という設計。
// 実物では fetch("/api/gacha/pull", ...) で取ってくる。
function fakePull() {
  const r = Math.random();
  const rarity = r < 0.05 ? 5 : r < 0.20 ? 4 : 3;
  return { character: "キャラ" + Math.floor(Math.random() * 100), rarity };
}

const stage = document.getElementById("stage");
const flash = document.getElementById("flash");
const btn   = document.getElementById("pull");

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

async function playEffect(rarity) {
  if (rarity >= 5) {
    flash.classList.add("on");
    await wait(250);
    flash.classList.remove("on");
    await wait(250);
  } else if (rarity >= 4) {
    await wait(400);
  }
}

async function pullOnce() {
  const result = fakePull();           // ← 結果は最初に確定
  await wait(300);                      // 暗転を擬似的に
  await playEffect(result.rarity);     // レア度に応じた演出
  const card = document.createElement("div");
  card.className = `card r${result.rarity}`;
  card.textContent = `★${result.rarity} ${result.character}`;
  stage.innerHTML = "";
  stage.appendChild(card);
  requestAnimationFrame(() => card.classList.add("show"));
  await wait(800);
}

btn.onclick = async () => {
  btn.disabled = true;
  for (let i = 0; i < 10; i++) await pullOnce();
  btn.disabled = false;
};
</script>
</body>
</html>
