<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ch16 / step 4 — WebSocket クライアント</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; padding: 20px; }
  h1 { font-size: 18px; }
  #log { border: 1px solid #ccc; padding: 12px; height: 320px; overflow-y: auto;
         background: #fafafa; font-family: monospace; font-size: 12px; }
  .item { padding: 4px 0; border-bottom: 1px solid #eee; }
  .rarity-5 { color: #f59e0b; font-weight: bold; }
  .rarity-4 { color: #c084fc; }
  .rarity-3 { color: #60a5fa; }
</style>
</head>
<body>
<h1>📡 ガチャ引いた通知タイムライン</h1>
<p>step3 のサーバを <code>python exercises/ch16/step3_websocket_server.py</code> で起動してから開く。</p>
<div id="log"></div>

<h2>テスト発火 (このタブから broadcast)</h2>
<button id="fire">★5 SSR を引いた! を全員に通知</button>

<script>
const log = document.getElementById("log");

const ws = new WebSocket("ws://127.0.0.1:8765");

ws.onmessage = (e) => {
  let p; try { p = JSON.parse(e.data); } catch { p = { msg: e.data }; }
  const div = document.createElement("div");
  div.className = "item " + (p.rarity ? `rarity-${p.rarity}` : "");
  div.textContent = JSON.stringify(p);
  log.prepend(div);
};

ws.onopen  = () => log.prepend(Object.assign(document.createElement("div"),
  { className: "item", textContent: "[connected]" }));
ws.onclose = () => log.prepend(Object.assign(document.createElement("div"),
  { className: "item", textContent: "[disconnected]" }));

document.getElementById("fire").onclick = () => {
  ws.send(JSON.stringify({
    type: "pull",
    user: "alice",
    character: "ドラゴン",
    rarity: 5,
    broadcast: true,
  }));
};
</script>
</body>
</html>
