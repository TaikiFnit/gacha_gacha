<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="sans-serif">
  <defs>
    <marker id="ja" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f46e5"/>
    </marker>
    <marker id="ja-r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#E6002D"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="450" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">
    user_characters JOIN characters ON c.id = uc.character_id
  </text>

  <!-- ===== LEFT-TOP: user_characters (履歴) ===== -->
  <g transform="translate(20, 50)">
    <text x="120" y="-6" font-size="12" fill="#6b7280">user_characters (履歴)</text>
    <rect x="0" y="0" width="290" height="160" fill="none" stroke="#1a1a2e" stroke-width="2"/>
    <rect x="0" y="0" width="290" height="32" fill="#fecaca" stroke="#1a1a2e" stroke-width="2"/>
    <text x="35"  y="20" text-anchor="middle" font-size="12" font-weight="bold">id</text>
    <text x="105" y="20" text-anchor="middle" font-size="12" font-weight="bold">user_id</text>
    <text x="200" y="20" text-anchor="middle" font-size="12" font-weight="bold">character_id</text>
    <text x="270" y="20" text-anchor="middle" font-size="11" font-weight="bold">obtained_at</text>
    <line x1="70"  y1="0" x2="70"  y2="160" stroke="#1a1a2e"/>
    <line x1="140" y1="0" x2="140" y2="160" stroke="#1a1a2e"/>
    <line x1="240" y1="0" x2="240" y2="160" stroke="#1a1a2e"/>

    <!-- rows -->
    <g font-size="13" fill="#1a1a2e">
      <text x="35"  y="55" text-anchor="middle">1</text>
      <text x="105" y="55" text-anchor="middle">1</text>
      <text x="200" y="55" text-anchor="middle">1</text>
      <text x="265" y="55" text-anchor="middle" font-size="10">04-26 10:00</text>
      <line x1="0" y1="64" x2="290" y2="64" stroke="#e5e7eb"/>

      <text x="35"  y="88" text-anchor="middle">2</text>
      <text x="105" y="88" text-anchor="middle">1</text>
      <text x="200" y="88" text-anchor="middle">3</text>
      <text x="265" y="88" text-anchor="middle" font-size="10">04-26 10:01</text>
      <line x1="0" y1="97" x2="290" y2="97" stroke="#e5e7eb"/>

      <text x="35"  y="121" text-anchor="middle">3</text>
      <text x="105" y="121" text-anchor="middle">1</text>
      <text x="200" y="121" text-anchor="middle">1</text>
      <text x="265" y="121" text-anchor="middle" font-size="10">04-26 10:02</text>
      <line x1="0" y1="130" x2="290" y2="130" stroke="#e5e7eb"/>

      <text x="35"  y="154" text-anchor="middle">4</text>
      <text x="105" y="154" text-anchor="middle">1</text>
      <text x="200" y="154" text-anchor="middle">10</text>
      <text x="265" y="154" text-anchor="middle" font-size="10">04-26 10:03</text>
    </g>
  </g>

  <!-- ===== LEFT-BOTTOM: characters (マスタ) ===== -->
  <g transform="translate(20, 270)">
    <text x="120" y="-6" font-size="12" fill="#6b7280">characters (マスタ)</text>
    <rect x="0" y="0" width="290" height="160" fill="none" stroke="#1a1a2e" stroke-width="2"/>
    <rect x="0" y="0" width="290" height="32" fill="#dbeafe" stroke="#1a1a2e" stroke-width="2"/>
    <text x="35"  y="20" text-anchor="middle" font-size="12" font-weight="bold">id</text>
    <text x="120" y="20" text-anchor="middle" font-size="12" font-weight="bold">name</text>
    <text x="200" y="20" text-anchor="middle" font-size="12" font-weight="bold">rarity</text>
    <text x="265" y="20" text-anchor="middle" font-size="12" font-weight="bold">emoji</text>
    <line x1="70"  y1="0" x2="70"  y2="160" stroke="#1a1a2e"/>
    <line x1="170" y1="0" x2="170" y2="160" stroke="#1a1a2e"/>
    <line x1="230" y1="0" x2="230" y2="160" stroke="#1a1a2e"/>

    <g font-size="13" fill="#1a1a2e">
      <text x="35"  y="55" text-anchor="middle">1</text>
      <text x="120" y="55" text-anchor="middle">スライム</text>
      <text x="200" y="55" text-anchor="middle">1</text>
      <text x="265" y="55" text-anchor="middle">🟢</text>
      <line x1="0" y1="64" x2="290" y2="64" stroke="#e5e7eb"/>

      <text x="35"  y="88" text-anchor="middle">3</text>
      <text x="120" y="88" text-anchor="middle">ゴブリン</text>
      <text x="200" y="88" text-anchor="middle">1</text>
      <text x="265" y="88" text-anchor="middle">👺</text>
      <line x1="0" y1="97" x2="290" y2="97" stroke="#e5e7eb"/>

      <text x="35"  y="121" text-anchor="middle">10</text>
      <text x="120" y="121" text-anchor="middle">ドラゴン</text>
      <text x="200" y="121" text-anchor="middle">5</text>
      <text x="265" y="121" text-anchor="middle">🐉</text>
      <line x1="0" y1="130" x2="290" y2="130" stroke="#e5e7eb"/>

      <text x="35"  y="154" text-anchor="middle">12</text>
      <text x="120" y="154" text-anchor="middle">伝説の勇者</text>
      <text x="200" y="154" text-anchor="middle">5</text>
      <text x="265" y="154" text-anchor="middle">⚔️</text>
    </g>
  </g>

  <!-- ===== JOIN arrows (uc.character_id → c.id) ===== -->
  <!-- uc row1 (char_id=1) → c row1 (id=1) -->
  <path d="M 240,90 C 350,95 350,310 320,325" fill="none" stroke="#E6002D" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- uc row2 (char_id=3) → c row2 (id=3) -->
  <path d="M 240,123 C 350,140 350,355 320,358" fill="none" stroke="#E6002D" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- uc row4 (char_id=10) → c row3 (id=10) -->
  <path d="M 240,189 C 350,200 350,388 320,391" fill="none" stroke="#E6002D" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="345" y="240" font-size="11" fill="#E6002D" font-weight="bold">JOIN keys</text>

  <!-- ===== Big arrow to result ===== -->
  <line x1="475" y1="230" x2="555" y2="230" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#ja)"/>
  <text x="515" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#4f46e5">JOIN</text>

  <!-- ===== RIGHT: joined result ===== -->
  <g transform="translate(570, 145)">
    <text x="155" y="-6" font-size="12" fill="#6b7280">結合結果</text>
    <rect x="0" y="0" width="310" height="170" fill="none" stroke="#4f46e5" stroke-width="2"/>
    <rect x="0" y="0" width="310" height="32" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="30"  y="20" text-anchor="middle" font-size="11" font-weight="bold">uc_id</text>
    <text x="100" y="20" text-anchor="middle" font-size="11" font-weight="bold">name</text>
    <text x="190" y="20" text-anchor="middle" font-size="11" font-weight="bold">rarity</text>
    <text x="245" y="20" text-anchor="middle" font-size="11" font-weight="bold">emoji</text>
    <text x="290" y="20" text-anchor="middle" font-size="10" font-weight="bold">obt</text>
    <line x1="60"  y1="0" x2="60"  y2="170" stroke="#4f46e5"/>
    <line x1="160" y1="0" x2="160" y2="170" stroke="#4f46e5"/>
    <line x1="220" y1="0" x2="220" y2="170" stroke="#4f46e5"/>
    <line x1="270" y1="0" x2="270" y2="170" stroke="#4f46e5"/>

    <g font-size="12" fill="#1a1a2e">
      <text x="30"  y="55" text-anchor="middle">1</text>
      <text x="100" y="55" text-anchor="middle">スライム</text>
      <text x="190" y="55" text-anchor="middle">1</text>
      <text x="245" y="55" text-anchor="middle">🟢</text>
      <text x="290" y="55" text-anchor="middle" font-size="9">10:00</text>
      <line x1="0" y1="64" x2="310" y2="64" stroke="#e5e7eb"/>

      <text x="30"  y="88" text-anchor="middle">2</text>
      <text x="100" y="88" text-anchor="middle">ゴブリン</text>
      <text x="190" y="88" text-anchor="middle">1</text>
      <text x="245" y="88" text-anchor="middle">👺</text>
      <text x="290" y="88" text-anchor="middle" font-size="9">10:01</text>
      <line x1="0" y1="97" x2="310" y2="97" stroke="#e5e7eb"/>

      <text x="30"  y="121" text-anchor="middle">3</text>
      <text x="100" y="121" text-anchor="middle">スライム</text>
      <text x="190" y="121" text-anchor="middle">1</text>
      <text x="245" y="121" text-anchor="middle">🟢</text>
      <text x="290" y="121" text-anchor="middle" font-size="9">10:02</text>
      <line x1="0" y1="130" x2="310" y2="130" stroke="#e5e7eb"/>

      <text x="30"  y="154" text-anchor="middle">4</text>
      <text x="100" y="154" text-anchor="middle">ドラゴン</text>
      <text x="190" y="154" text-anchor="middle">5</text>
      <text x="245" y="154" text-anchor="middle">🐉</text>
      <text x="290" y="154" text-anchor="middle" font-size="9">10:03</text>
    </g>

    <text x="155" y="190" text-anchor="middle" font-size="11" fill="#4f46e5">
      履歴行に「キャラ情報」 が結合された
    </text>
  </g>
</svg>
