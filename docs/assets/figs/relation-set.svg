<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <marker id="arrow-main" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a1a2e"/>
    </marker>
  </defs>

  <!-- Left side: Table -->
  <g transform="translate(30, 40)">
    <!-- Table border -->
    <rect x="0" y="0" width="240" height="190" rx="4" ry="4" fill="none" stroke="#1a1a2e" stroke-width="2.5"/>

    <!-- Header row -->
    <rect x="0" y="0" width="240" height="48" rx="4" ry="4" fill="#fecaca" stroke="#1a1a2e" stroke-width="2.5"/>
    <rect x="1" y="28" width="238" height="20" fill="#fecaca"/>
    <line x1="0" y1="48" x2="240" y2="48" stroke="#1a1a2e" stroke-width="2.5"/>

    <!-- Header text -->
    <text x="40" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a2e">id</text>
    <text x="120" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a2e">name</text>
    <text x="200" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a2e">age</text>

    <!-- Column separators -->
    <line x1="80" y1="0" x2="80" y2="190" stroke="#1a1a2e" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="190" stroke="#1a1a2e" stroke-width="1"/>

    <!-- Data row 1 (white) -->
    <rect x="1" y="49" width="238" height="46" fill="#ffffff"/>
    <text x="40" y="78" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1a1a2e">1</text>
    <text x="120" y="78" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1a1a2e">田中</text>
    <text x="200" y="78" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1a1a2e">22</text>
    <line x1="0" y1="95" x2="240" y2="95" stroke="#1a1a2e" stroke-width="1"/>

    <!-- Data row 2 (light grey) -->
    <rect x="1" y="96" width="238" height="46" fill="#f9fafb"/>
    <text x="40" y="125" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1a1a2e">2</text>
    <text x="120" y="125" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1a1a2e">佐藤</text>
    <text x="200" y="125" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1a1a2e">17</text>
    <line x1="0" y1="142" x2="240" y2="142" stroke="#1a1a2e" stroke-width="1"/>

    <!-- Data row 3 (white) -->
    <rect x="1" y="143" width="238" height="46" fill="#ffffff"/>
    <text x="40" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1a1a2e">3</text>
    <text x="120" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1a1a2e">鈴木</text>
    <text x="200" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1a1a2e">25</text>

    <!-- Label under table -->
    <text x="120" y="215" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a1a2e">テーブル表現</text>
  </g>

  <!-- Arrow from table to set -->
  <line x1="310" y1="135" x2="410" y2="135" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arrow-main)"/>
  <text x="360" y="120" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a1a2e">=</text>

  <!-- Right side: Set (ellipse) -->
  <g transform="translate(430, 10)">
    <!-- Ellipse -->
    <ellipse cx="165" cy="130" rx="155" ry="120" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>

    <!-- Set label at top -->
    <text x="165" y="35" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3b82f6">{ タプルの集合 }</text>

    <!-- Tuple elements scattered (not in order) -->
    <!-- Tuple 3 (top-left area) -->
    <g>
      <rect x="40" y="55" width="190" height="32" rx="14" ry="14" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="135" y="76" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a1a2e">(3, 鈴木, 25)</text>
    </g>

    <!-- Tuple 1 (center area) -->
    <g>
      <rect x="70" y="110" width="190" height="32" rx="14" ry="14" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="165" y="131" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a1a2e">(1, 田中, 22)</text>
    </g>

    <!-- Tuple 2 (bottom area) -->
    <g>
      <rect x="55" y="165" width="190" height="32" rx="14" ry="14" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="150" y="186" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a1a2e">(2, 佐藤, 17)</text>
    </g>

    <!-- Properties below ellipse -->
    <text x="165" y="275" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">&#x2713; 重複がない（各要素は一意）</text>
    <text x="165" y="300" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">&#x2713; 順序がない（並びは不定）</text>

    <!-- Label under set -->
    <text x="165" y="335" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a1a2e">集合表現</text>
  </g>
</svg>
