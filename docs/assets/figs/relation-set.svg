<!--
  「リレーション = タプルの集合」 を視覚化した図
  本リポジトリ用のオリジナル作画。 ライセンスは LICENSE (MIT) に従う。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img"
     aria-label="テーブル形式のリレーションが、 タプル (行) の集合と等価である様子">
  <defs>
    <marker id="se-arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/>
    </marker>
    <style>
      .frame { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
      .head  { fill: #e0e7ff; stroke: #1f2937; stroke-width: 2; }
      .alt   { fill: #f9fafb; }
      .grid  { stroke: #1f2937; stroke-width: 1; }
      .head-text { font: 700 14px sans-serif; fill: #1f2937; text-anchor: middle; }
      .cell  { font: 14px sans-serif; fill: #1f2937; text-anchor: middle; }
      .caption { font: 700 14px sans-serif; fill: #1f2937; text-anchor: middle; }
      .equal { font: 700 28px sans-serif; fill: #4f46e5; text-anchor: middle; }
      .set-bg { fill: #ede9fe; stroke: #4f46e5; stroke-width: 2; stroke-dasharray: 4 4; }
      .set-tag { font: 13px monospace; fill: #4f46e5; text-anchor: middle; }
      .tuple { fill: #ffffff; stroke: #4f46e5; stroke-width: 1.5; }
      .tuple-text { font: 13px sans-serif; fill: #1f2937; text-anchor: middle; }
      .property { font: 13px sans-serif; fill: #4338ca; text-anchor: middle; }
    </style>
  </defs>

  <!-- ============== Left: Table ============== -->
  <g transform="translate(40, 60)">
    <rect class="frame" x="0" y="0" width="270" height="200" rx="6"/>
    <rect class="head"  x="0" y="0" width="270" height="44" rx="6"/>
    <rect class="head"  x="0" y="22" width="270" height="22"/>
    <line class="grid"  x1="0"  y1="44"  x2="270" y2="44"/>
    <line class="grid"  x1="80" y1="0"   x2="80"  y2="200"/>
    <line class="grid"  x1="180" y1="0"  x2="180" y2="200"/>
    <text class="head-text" x="40"  y="29">id</text>
    <text class="head-text" x="130" y="29">name</text>
    <text class="head-text" x="225" y="29">age</text>

    <text class="cell" x="40"  y="73">1</text>
    <text class="cell" x="130" y="73">田中</text>
    <text class="cell" x="225" y="73">22</text>
    <line class="grid" x1="0" y1="96" x2="270" y2="96"/>

    <rect class="alt" x="2" y="97" width="266" height="50"/>
    <text class="cell" x="40"  y="125">2</text>
    <text class="cell" x="130" y="125">佐藤</text>
    <text class="cell" x="225" y="125">17</text>
    <line class="grid" x1="0" y1="148" x2="270" y2="148"/>

    <text class="cell" x="40"  y="177">3</text>
    <text class="cell" x="130" y="177">鈴木</text>
    <text class="cell" x="225" y="177">25</text>

    <text class="caption" x="135" y="230">テーブルでの見え方</text>
  </g>

  <!-- ============== Center: equals sign ============== -->
  <text class="equal" x="370" y="170">=</text>

  <!-- ============== Right: Set (rounded rect, dashed) ============== -->
  <g transform="translate(420, 50)">
    <rect class="set-bg" x="0" y="0" width="340" height="220" rx="20"/>
    <text class="set-tag" x="170" y="24">{ tuple, tuple, tuple, ... }</text>

    <!-- tuples scattered (not in original row order, to emphasize unordered) -->
    <g transform="translate(45, 50)">
      <rect class="tuple" x="0" y="0" width="170" height="34" rx="14"/>
      <text class="tuple-text" x="85" y="22">(3, 鈴木, 25)</text>
    </g>
    <g transform="translate(120, 105)">
      <rect class="tuple" x="0" y="0" width="170" height="34" rx="14"/>
      <text class="tuple-text" x="85" y="22">(1, 田中, 22)</text>
    </g>
    <g transform="translate(60, 158)">
      <rect class="tuple" x="0" y="0" width="170" height="34" rx="14"/>
      <text class="tuple-text" x="85" y="22">(2, 佐藤, 17)</text>
    </g>

    <text class="caption" x="170" y="245">タプルの集合 (リレーション)</text>
  </g>

  <!-- bottom captions -->
  <g transform="translate(0, 320)">
    <text class="property" x="200" y="0">→ 各タプルは一意 (重複なし)</text>
    <text class="property" x="600" y="0">→ タプルの並び順に意味なし</text>
  </g>
</svg>
