<!--
  リレーションの構成要素 (リレーション / アトリビュート / タプル) の対応図
  本リポジトリ用のオリジナル作画。 ライセンスは LICENSE (MIT) に従う。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img"
     aria-label="リレーションを構成する要素 (リレーション本体・列＝アトリビュート・行＝タプル) の対応図">
  <defs>
    <marker id="rs-arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#4f46e5"/>
    </marker>
    <style>
      .frame { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
      .head  { fill: #e0e7ff; stroke: #1f2937; stroke-width: 2; }
      .alt   { fill: #f9fafb; }
      .grid  { stroke: #1f2937; stroke-width: 1; }
      .label { font: 700 13px sans-serif; fill: #4f46e5; }
      .sub   { font: 12px sans-serif; fill: #4f46e5; }
      .cell  { font: 14px sans-serif; fill: #1f2937; text-anchor: middle; }
      .head-text { font: 700 14px sans-serif; fill: #1f2937; text-anchor: middle; }
      .arr   { stroke: #4f46e5; stroke-width: 1.5; fill: none; marker-end: url(#rs-arr); }
      .tuple-hi { fill: #ede9fe; }
    </style>
  </defs>

  <!-- ===== Table center ===== -->
  <g transform="translate(180, 70)">
    <!-- frame -->
    <rect class="frame" x="0" y="0" width="320" height="200" rx="6"/>

    <!-- header -->
    <rect class="head" x="0" y="0" width="320" height="44" rx="6"/>
    <rect class="head" x="0" y="22" width="320" height="22"/>
    <line class="grid" x1="0"  y1="44"  x2="320" y2="44"/>
    <line class="grid" x1="100" y1="0"  x2="100" y2="200"/>
    <line class="grid" x1="220" y1="0"  x2="220" y2="200"/>
    <text class="head-text" x="50"  y="29">id</text>
    <text class="head-text" x="160" y="29">name</text>
    <text class="head-text" x="270" y="29">age</text>

    <!-- row 1 -->
    <text class="cell" x="50"  y="73">1</text>
    <text class="cell" x="160" y="73">田中</text>
    <text class="cell" x="270" y="73">22</text>
    <line class="grid" x1="0" y1="96" x2="320" y2="96"/>

    <!-- row 2 (highlighted as the "tuple" example) -->
    <rect class="tuple-hi" x="2" y="97" width="316" height="50"/>
    <text class="cell" x="50"  y="125">2</text>
    <text class="cell" x="160" y="125">佐藤</text>
    <text class="cell" x="270" y="125">17</text>
    <line class="grid" x1="0" y1="148" x2="320" y2="148"/>

    <!-- row 3 -->
    <rect class="alt" x="2" y="149" width="316" height="49"/>
    <text class="cell" x="50"  y="177">3</text>
    <text class="cell" x="160" y="177">鈴木</text>
    <text class="cell" x="270" y="177">25</text>
  </g>

  <!-- ===== Annotation: Relation (whole table) ===== -->
  <path class="arr" d="M70 170 L 178 170"/>
  <text class="label" x="20" y="160">リレーション</text>
  <text class="sub"   x="20" y="178">(Relation) = 表 全体</text>

  <!-- ===== Annotation: Attribute (header / column) ===== -->
  <path class="arr" d="M620 90  L 502 88"/>
  <text class="label" x="540" y="60" >アトリビュート</text>
  <text class="sub"   x="540" y="78" >(Attribute) = 列</text>

  <!-- ===== Annotation: Tuple (highlighted middle row) ===== -->
  <path class="arr" d="M620 200  L 502 168"/>
  <text class="label" x="540" y="220">タプル</text>
  <text class="sub"   x="540" y="238">(Tuple) = 行</text>

  <!-- bottom caption -->
  <text x="360" y="330" text-anchor="middle"
        font-family="sans-serif" font-size="13" fill="#6b7280">
    1 つのリレーションは、 アトリビュート (列) を共通にもつタプル (行) の集まりである
  </text>
</svg>
